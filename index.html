/* Pemilih multi-format: daftar jelas, nyaman di desktop dan layar ponsel. */

const ORDER_RULES={
 B2:['golongan','nama'], B3:['tanggal'], B4:['tanggal','nama'],
 C2:['nama'], C3:['tanggal'], C4:['tanggal','nama'], C5:['tanggal','kelas','praktikum'], C6:['tanggal','lab','alat'],
 D1:['nama'], D2:['nama'], D3:['tanggal'], D4:['tanggal','nama'], D5:['tanggal','kelas','praktikum'], D6:['tanggal','lab','bahan'],
 E:['nama'], F:['tanggal','waktu']
};
// Sel gabung hanya untuk klasifikasi inventaris, bukan tanggal, jumlah atau identitas unik.
const MERGE_RULES={B2:['golongan']};
const collatorID=new Intl.Collator('id-ID',{numeric:true,sensitivity:'base'});
function cmpField(a,b,key){
 const av=String(a?.[key]??'').trim(),bv=String(b?.[key]??'').trim();
 if(!av&&!bv)return 0;
 if(!av)return 1; // data tanpa tanggal/golongan ke belakang
 if(!bv)return -1;
 if(key==='waktu'){
  const parse=v=>{const m=v.match(/^(\d{1,2})[.:](\d{2})/);return m?Number(m[1])*60+Number(m[2]):NaN};
  const x=parse(av),y=parse(bv);if(Number.isFinite(x)&&Number.isFinite(y)&&x!==y)return x-y;
 }
 // input type=date menggunakan YYYY-MM-DD; urutan alfabetis == urutan kronologis.
 return collatorID.compare(av,bv);
}
function orderedRows(s){
 const rows=db.records[s.id]||[],keys=ORDER_RULES[s.id];
 if(!keys)return [...rows];
 return rows.map((row,index)=>({row,index})).sort((a,b)=>{
  for(const key of keys){const diff=cmpField(a.row,b.row,key);if(diff)return diff}
  return a.index-b.index; // urutan penyimpanan jika nilai pengurutan sama
 }).map(item=>item.row);
}
function mergeKeys(s){return MERGE_RULES[s.id]||[]}
function normalizedMergeValue(row,key){return String(row?.[key]??'').trim().toLocaleLowerCase('id-ID')}
function sameMerge(rows,key,i,j){return i>=0&&j>=0&&i<rows.length&&j<rows.length&&!!normalizedMergeValue(rows[i],key)&&normalizedMergeValue(rows[i],key)===normalizedMergeValue(rows[j],key)}
function mergeLength(rows,key,index){let n=1;while(sameMerge(rows,key,index,index+n))n++;return n}
function orderingDescription(s){
 if(s.id==='B2')return 'Dikelompokkan berdasarkan Golongan Barang (A–Z), lalu Nama Barang. Golongan sama yang berurutan ditampilkan sebagai satu sel.';
 if(['B3','C3','D3'].includes(s.id))return 'Riwayat transaksi otomatis berurutan dari tanggal paling awal ke paling akhir, termasuk jika tanggal lama baru dimasukkan.';
 if(s.id==='F')return 'Agenda otomatis diurutkan berdasarkan tanggal, lalu jam mulai.';
 if(['B4','C4','C5','C6','D4','D5','D6'].includes(s.id))return 'Data otomatis diurutkan menurut tanggal kegiatan/usulan, lalu identitas terkait.';
 if(['C2','D1','D2','E'].includes(s.id))return 'Daftar otomatis diurutkan menurut nama (A–Z).';
 return 'Urutan asli saat data dimasukkan dipertahankan karena format ini tidak memerlukan penyortiran otomatis.';
}

function renderTable(){
 const s=spec(active);let rows=orderedRows(s);
 if(filterTerm.trim())rows=rows.filter(r=>s.fields.some(f=>String(r[f[0]]||'').toLowerCase().includes(filterTerm.toLowerCase())));
 const cols=s.fields,host=el('table-host');if(!host)return;
 const widthsArr=widths(s),total=widthsArr.reduce((a,b)=>a+b,0),actionWidth=9;
 const colgroup=`<colgroup>${widthsArr.map(w=>`<col style="width:${(w/total*(100-actionWidth)).toFixed(2)}%">`).join('')}<col style="width:${actionWidth}%"></colgroup>`;

   return `<td ${span>1?`rowspan="${span}"`:''} class="${isNumeric(f)?'data-numeric ':''}${span>1?'merged-cell':''}" title="${esc(formatValue(r[key],f))}">${esc(formatValue(r[key],f)||'—')}</td>`;
  }).join('')}<td class="actions-col"><button class="action-mini" onclick="editRecord('${esc(r.__id)}')">Edit</button><button class="action-mini danger" onclick="deleteRecord('${esc(r.__id)}')">Hapus</button></td></tr>`).join('');
 host.innerHTML=`<div class="table-container"><table class="data-table" style="min-width:${Math.max(900,(cols.length+2)*110)}px">${colgroup}<thead><tr><th class="index-col">No.</th>${cols.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th class="actions-col">Tindakan</th></tr></thead><tbody>${rows.length?dataRows:blankRows}</tbody></table></div>${rows.length?'':`<div class="table-empty-hint">${filterTerm?'Tidak ditemukan data yang sesuai pencarian.':'Tabel siap diisi. Klik <b>Isi</b> pada baris kosong atau <b>Tambah Data</b> di atas. Baris kosong ini hanya contoh tampilan dan belum dihitung sebagai data.'}</div>`}`;

async function submitForm(e){
 e.preventDefault();if(isSaving)return;isSaving=true;

const xp=(text,{bold=false,size=18,center=false,right=false,color='21354A',breakBefore=false,spaceAfter=80}={})=>`<w:p><w:pPr>${breakBefore?'<w:pageBreakBefore/>':''}${right?'<w:jc w:val="right"/>':center?'<w:jc w:val="center"/>':''}<w:spacing w:after="${spaceAfter}"/></w:pPr><w:r><w:rPr>${bold?'<w:b/>':''}<w:color w:val="${color}"/><w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
// Proporsi kolom konsisten pada web, DOCX, dan PDF.
// Kolom nomor/kode/jumlah lebih kecil; nama, uraian, keterangan lebih lebar.
function widths(s){
 const weights=s.fields.map(f=>{
  const key=f[0].toLowerCase(),label=f[1].toLowerCase(),type=f[2];
  if(type==='number'||/^(baik|rusak|total|stok|sisa|masuk|keluar|tersedia|diminta|peserta)$/.test(key)||/^jumlah/.test(label))return 6.5;
  if(/^(kode|nomor|no|induk)$/.test(key)||/kode|nomor bukti|no\.|nomor induk/.test(label))return 9;
  if(key==='nip'||/nip|nuptk/.test(label))return 12;
  if(type==='date'||key==='waktu')return 9;
  if(/^(nama|alat|bahan|barang|praktikum|kegiatan|ruangan|lab)$/.test(key)||/nama alat|nama bahan|nama barang|nama kegiatan/.test(label))return 22;
  if(/^(ket|keterangan|catatan|alasan|spesifikasi|keperluan|tugas|hasil)$/.test(key)||/keterangan|spesifikasi|kegunaan|tugas pokok/.test(label))return 17;

  return 12;
 });
 weights.unshift(4.1);const sum=weights.reduce((a,b)=>a+b,0),target=15120;

function xtc(text,width,{bold=false,head=false,center=false,merge=null,compact=false}={}){

 // Satuan twip (1/20 pt): sel berisi teks mendapat ~6,5pt ruang kiri/kanan.

 const cellPad = width < 500 ? 55 : width < 850 ? 75 : head ? 105 : 130;
 return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${mergeXml}<w:shd w:fill="${head?'19385A':'FFFFFF'}"/><w:vAlign w:val="center"/><w:tcMar><w:top w:w="${compact?18:70}" w:type="dxa"/><w:left w:w="${cellPad}" w:type="dxa"/><w:start w:w="${cellPad}" w:type="dxa"/><w:bottom w:w="${compact?18:70}" w:type="dxa"/><w:right w:w="${cellPad}" w:type="dxa"/><w:end w:w="${cellPad}" w:type="dxa"/></w:tcMar></w:tcPr><w:p><w:pPr>${center?'<w:jc w:val="center"/>':''}<w:spacing w:after="0"/></w:pPr><w:r><w:rPr>${bold?'<w:b/>':''}<w:sz w:val="15"/><w:color w:val="${head?'FFFFFF':'21354A'}"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p></w:tc>`;
}

 const headrow=`<w:tr><w:trPr><w:tblHeader/></w:trPr>${['No.',...s.fields.map(f=>f[1])].map((label,i)=>xtc(label,widthsArr[i],{head:true,bold:true,center:true})).join('')}</w:tr>`;
 const rows=rowsFor(s),merged=mergeKeys(s);
 const trs=rows.map((r,idx)=>{const compact=Object.keys(r).length===0;return `<w:tr>${xtc(String(idx+1),widthsArr[0],{center:true,compact})}${s.fields.map((f,j)=>{
  const key=f[0];let merge=null,content=formatValue(r[key],f);
  if(merged.includes(key)){
   if(sameMerge(rows,key,idx,idx-1)){merge='continue';content='';}
   else if(sameMerge(rows,key,idx,idx+1))merge='restart';
  }
  return xtc(content,widthsArr[j+1],{center:centeredField(f),merge,compact});
 }).join('')}</w:tr>`}).join('');
 return `<w:tbl><w:tblPr><w:tblW w:w="15120" w:type="dxa"/><w:tblLayout w:type="fixed"/>${borders}</w:tblPr><w:tblGrid>${grid}</w:tblGrid>${headrow}${trs}</w:tbl>`;
}
function xSignatures(settings){

 const paragraph=(value,after=0,bold=false,under=false)=>`<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="${after}"/></w:pPr><w:r><w:rPr>${bold?'<w:b/>':''}${under?'<w:u w:val="single"/>':''}<w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">${xmlEscape(value)}</w:t></w:r></w:p>`;
 const cells=signatureParts(settings).map((x,i)=>`<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/><w:vAlign w:val="top"/></w:tcPr>${paragraph(x.intro||' ',20)}${paragraph(x.role,0,true)}${paragraph(' ',1050)}${paragraph(x.name||'( ..................................... )',12,true,true)}${paragraph(x.nip||'NIP/NIK: ........................')}</w:tc>`).join('');
 return `<w:tbl><w:tblPr><w:tblW w:w="15120" w:type="dxa"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr>${cells}</w:tr></w:tbl>`;
}
function docxXml(formats){

  body+=xp(`LEMBAR ADMINISTRASI LABORATORIUM SEKOLAH  |  FORMAT ${s.id}`,{size:15,center:true,bold:true,color:'087C73',breakBefore:i>0,spaceAfter:70});
  body+=xp(s.name.toUpperCase(),{size:26,center:true,bold:true,color:'173958',spaceAfter:105});
  body+=xp(`NAMA SEKOLAH : ${set.sekolah||'......................................................'}    ${set.npsn?' |  NPSN: '+set.npsn:''}`,{size:17,bold:true,spaceAfter:38});
  body+=xp(`LABORATORIUM : ${set.lab||'........................'}      |      TAHUN PELAJARAN : ${set.tahun||'................'}      |      SEMESTER : ${set.semester||'.............'}`,{size:16,spaceAfter:35});
  if(set.alamatSekolah)body+=xp(`ALAMAT : ${set.alamatSekolah}`,{size:15,spaceAfter:35});
  body+=`<w:p><w:pPr><w:spacing w:after="86"/><w:pBdr><w:bottom w:val="single" w:sz="11" w:space="3" w:color="087C73"/></w:pBdr></w:pPr></w:p>`;
  body+=xTable(s);
  body+=xp(`Jumlah data terisi: ${count(s.id)}`,{size:14,color:'51667B',spaceAfter:85});
  body+=xp(reportPlaceDate(),{size:17,right:true,spaceAfter:140});
  body+=xSignatures(set);

async function makeDocxBlob(formatId){
 if(typeof JSZip==='undefined')throw Error('Modul DOCX tidak tersedia');
 const z=new JSZip();z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',docxXml(selected(formatId)));return z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
}
async function exportDocx(formatId=active){try{const blob=await makeDocxBlob(formatId);download(blob,filename('docx',formatId));toast('Format '+formatId+' berhasil diunduh sebagai DOCX')}catch(e){console.error(e);toast('Gagal membuat DOCX')}}
// Generator PDF mandiri: A4 horizontal, tabel multi-halaman, tanpa pustaka atau koneksi internet.
const pdfClean=s=>String(s??'').replace(/[–—−]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/²/g,'2').replace(/³/g,'3').replace(/[^\x20-\x7E]/g,'?');
function pdfText(s){return '('+pdfClean(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\n\r\t]/g,' ')+')'}
function pdfWrap(txt,maxWidth,size=7){const words=pdfClean(txt).replace(/[\n\r\t]/g,' ').split(/\s+/).filter(Boolean),lines=[];let current='';const fits=str=>str.length*size*.51<=maxWidth;for(const w of words){if(fits((current?current+' ':'')+w)){current+=(current?' ':'')+w;}else{if(current)lines.push(current);if(fits(w)){current=w;}else{let segment='';for(const c of w){if(!fits(segment+c)){if(segment)lines.push(segment);segment=c;}else segment+=c;}current=segment;}}}if(current)lines.push(current);return lines.length?lines:[''];}
const pdfNum=n=>Number(n).toFixed(2);
function pdfPage(){return {ops:[],y:0};}
let pdfMeasureContext=null;
function pdfWidth(text,size=8,bold=false){
 if(!pdfMeasureContext)pdfMeasureContext=document.createElement('canvas').getContext('2d');
 if(!pdfMeasureContext)return pdfClean(text).length*size*.5;
 pdfMeasureContext.font=`${bold?'bold ':''}${size}px Arial`;
 return pdfMeasureContext.measureText(pdfClean(text)).width;
}
function pdfWriteText(page,x,y,t,size=9,bold=false,r=0.13,g=0.22,b=.29){page.ops.push(`${pdfNum(r)} ${pdfNum(g)} ${pdfNum(b)} rg BT /${bold?'F2':'F1'} ${pdfNum(size)} Tf 1 0 0 1 ${pdfNum(x)} ${pdfNum(y)} Tm ${pdfText(t)} Tj ET`)}
function pdfRect(page,x,y,w,h,filled=false){
 if(filled)page.ops.push(`0.10 0.22 0.36 rg ${pdfNum(x)} ${pdfNum(y)} ${pdfNum(w)} ${pdfNum(h)} re f`);
 page.ops.push(`0.28 0.37 0.48 RG 0.9 w ${pdfNum(x)} ${pdfNum(y)} ${pdfNum(w)} ${pdfNum(h)} re S`);
}
function makePDF(formats){
 const W=842,H=595,margin=31,tableW=W-2*margin;let pages=[],page=null,columns=[],colWidths=[],font=7;
 const st=db.settings;
 // Padding kiri-kanan per sel (satuan pt) untuk semua tabel ekspor PDF.
 // Kolom nomor kecil lebih hemat, kolom berisi nama/keterangan lebih lapang.
 const cellPadPt=(i)=>i===0?3.5:colWidths[i]<42?4.8:colWidths[i]<58?6.3:9;
 function centered(xCenter,y,text,size=8,bold=false){const t=pdfClean(text);pdfWriteText(page,xCenter-t.length*size*.24,y,t,size,bold)}
 function newPage(s,continued=false){
  page=pdfPage();pages.push(page);
  pdfWriteText(page,margin,H-29,'LEMBAR ADMINISTRASI LABORATORIUM SEKOLAH',7.5,true,0.04,.48,.44);
  pdfWriteText(page,W-103,H-29,`FORMAT ${s.id}${continued?' (Lanjutan)':''}`,8,true,.10,.23,.36);
  page.ops.push(`0.06 0.49 0.44 RG 1.3 w ${pdfNum(margin)} ${pdfNum(H-37)} m ${pdfNum(W-margin)} ${pdfNum(H-37)} l S`);
  centered(W/2,H-55,s.name.toUpperCase(),13,true);
  centered(W/2,H-70,st.sekolah||'NAMA SEKOLAH: ...................................................',9,true);
  const info=`LABORATORIUM: ${st.lab||'...................'}  |  TAHUN PELAJARAN: ${st.tahun||'-'}  |  SEMESTER: ${st.semester||'-'}${st.npsn?'  |  NPSN: '+st.npsn:''}`;
  centered(W/2,H-85,info,7.6);
  if(st.alamatSekolah)centered(W/2,H-97,st.alamatSekolah,7);
  page.y=H-107;drawHeader();
 }
 function drawHeader(){
  const sf=columns[0];let x=margin;const labels=['No.',...sf.fields.map(f=>f[1])];
  const lines=labels.map((t,i)=>pdfWrap(t,colWidths[i]-2*cellPadPt(i),font+.2));
  const h=Math.max(31,...lines.map(l=>l.length*(font+1.5)+12));
  pdfRect(page,margin,page.y-h,tableW,h,true);
  labels.forEach((_,i)=>{pdfRect(page,x,page.y-h,colWidths[i],h);lines[i].forEach((line,j)=>{const xc=i===0||centeredField(sf.fields[i-1])?x+(colWidths[i]-pdfWidth(line,font+.2,true))/2:x+cellPadPt(i);pdfWriteText(page,xc,page.y-12-j*(font+1.7),line,font+.2,true,1,1,1)});x+=colWidths[i]});page.y-=h;
 }
 function drawData(s,r,index,rows){
  const vals=[String(index+1),...s.fields.map(f=>formatValue(r[f[0]],f))];
  const wrapped=vals.map((t,i)=>pdfWrap(t,colWidths[i]-2*cellPadPt(i),font));
  const isBlank=Object.keys(r).length===0;
  const height=isBlank?18:Math.max(25,...wrapped.map(lines=>lines.length*(font+2)+11));
  let newSheet=false;
  if(page.y-height<98){newPage(s,true);newSheet=true;}
  let x=margin;
  wrapped.forEach((lines,i)=>{
   const key=i===0?null:s.fields[i-1][0],grouped=key&&mergeKeys(s).includes(key);
   const prev=grouped&&sameMerge(rows,key,index,index-1)&&!newSheet;
   const next=grouped&&sameMerge(rows,key,index,index+1);
   if(grouped&&(prev||next)){
    const top=page.y,bottom=page.y-height,right=x+colWidths[i];
    page.ops.push(`0.28 0.37 0.48 RG 0.9 w ${pdfNum(x)} ${pdfNum(bottom)} m ${pdfNum(x)} ${pdfNum(top)} l S`);
    page.ops.push(`0.28 0.37 0.48 RG 0.9 w ${pdfNum(right)} ${pdfNum(bottom)} m ${pdfNum(right)} ${pdfNum(top)} l S`);
    if(!prev)page.ops.push(`0.28 0.37 0.48 RG 0.9 w ${pdfNum(x)} ${pdfNum(top)} m ${pdfNum(right)} ${pdfNum(top)} l S`);
    if(!next||bottom-25<98)page.ops.push(`0.28 0.37 0.48 RG 0.9 w ${pdfNum(x)} ${pdfNum(bottom)} m ${pdfNum(right)} ${pdfNum(bottom)} l S`);
   }else pdfRect(page,x,page.y-height,colWidths[i],height);
   if(!prev)lines.forEach((line,j)=>{
    const alignCenter=i===0||centeredField(s.fields[i-1]);
    const xc=alignCenter?x+(colWidths[i]-pdfWidth(line,font))/2:x+cellPadPt(i);
    pdfWriteText(page,xc,page.y-11-j*(font+2),line,font);
   });
   x+=colWidths[i];
  });
  page.y-=height;
 }
 function sign(s){
  if(page.y<162)newPage(s,true);
  page.y-=13;
  pdfWriteText(page,margin,page.y,`Jumlah data terisi: ${count(s.id)}`,7,false,.32,.40,.47);
  const yDate=page.y-16;
  const dateLabel=reportPlaceDate();pdfWriteText(page,W-margin-pdfWidth(dateLabel,8),yDate,dateLabel,8);
  const roles=signatureParts(st),width=tableW/3;
  for(let i=0;i<3;i++){
   const sx=margin+width*(i+.5),info=roles[i];
   centered(sx,yDate-25,info.intro||' ',8);
   centered(sx,yDate-39,info.role,8,true);
   centered(sx,yDate-103,info.name||'( ..................................... )',8,true);
   centered(sx,yDate-118,info.nip||'NIP/NIK: ........................',7);
  }
 }
 for(const s of formats){
  columns=[s];const ws=widths(s),sum=ws.reduce((a,b)=>a+b,0);
  colWidths=ws.map(w=>tableW*w/sum);font=s.fields.length>=10?5.7:s.fields.length>=9?6:s.fields.length>=8?6.4:7.2;
  newPage(s);const exportRows=rowsFor(s);exportRows.forEach((r,i)=>drawData(s,r,i,exportRows));sign(s);
 }
 pages.forEach((p,i)=>{pdfWriteText(p,margin,17,'Laborium | Administrasi Laboratorium - adaptasi Faradiba (2023)',7,false,.5,.57,.63);pdfWriteText(p,W-108,17,`Halaman ${i+1} / ${pages.length}`,7,false,.5,.57,.63)});
 let objects=[''];const put=str=>{objects.push(str);return objects.length-1};
 const font1=put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 const font2=put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const pagesObj=put(''),pageIds=[];
 for(const p of pages){const data=p.ops.join('\n')+'\n';const streamId=put(`<< /Length ${data.length} >>\nstream\n${data}endstream`);pageIds.push(put(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${streamId} 0 R >>`))}
 objects[pagesObj]=`<< /Type /Pages /Count ${pages.length} /Kids [ ${pageIds.map(id=>id+' 0 R').join(' ')} ] >>`;
 const catalog=put(`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
 let out='%PDF-1.4\n%âãÏÓ\n';const offsets=[0];
 for(let i=1;i<objects.length;i++){offsets.push(out.length);out+=`${i} 0 obj\n${objects[i]}\nendobj\n`}
 const xref=out.length;out+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objects.length;i++)out+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
 out+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([Uint8Array.from(out,c=>c.charCodeAt(0)&255)],{type:'application/pdf'});
}
function exportPdf(formatId=active){try{const blob=makePDF(selected(formatId));download(blob,filename('pdf',formatId));toast('Format '+formatId+' berhasil diunduh sebagai PDF')}catch(e){console.error(e);toast('Gagal membuat PDF')}}
// Banyak format = satu ZIP berisi satu dokumen per format. Tak pernah menambah format yang tidak dicentang.
async function exportSelected(type){
 if(exportInProgress)return;
 const ids=checkedExportIds();
 if(!ids.length){toast('Centang setidaknya satu format');return}
 if(ids.length===1){if(type==='docx')return exportDocx(ids[0]);return exportPdf(ids[0]);}
 if(typeof JSZip==='undefined'){toast('Modul ZIP tidak tersedia');return;}
 exportInProgress=true;updateExportUI();
 try{
  const archive=new JSZip();
  for(const id of ids){
   const blob=type==='docx'?await makeDocxBlob(id):makePDF(selected(id));
   archive.file(filename(type,id),blob);
  }
  const zipBlob=await archive.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  download(zipBlob,`Laborium_${ids.length}_Format_Pilihan_${type.toUpperCase()}.zip`);
  toast(`${ids.length} format berhasil diunduh (ZIP berisi ${ids.length} file ${type.toUpperCase()})`);
 }catch(e){console.error(e);toast('Gagal menyiapkan unduhan pilihan')}
 finally{exportInProgress=false;updateExportUI();}
}
window.addEventListener('DOMContentLoaded',()=>{el('hamburger').addEventListener('click',()=>el('sidebar').classList.toggle('open'));el('import-json').addEventListener('change',importJson);render();initializeStorage()});
