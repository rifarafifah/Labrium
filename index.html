
<script>
(() => {
  const normalize = value => String(value)
    .replace(/^SIM-(?=(?:B-|BA-|C2-|D2-))/, '')
    .replace(/ \((?:referensi contoh|contoh kelas X|contoh|simulasi|asumsi)\)/gi, '')
    .replace(/simulasi penambahan sarana/gi, 'penambahan sarana')
    .replace(/Contoh air kapur/gi, 'Air kapur')
    .replace(/; (?:24 orang hanya asumsi|kapasitas asumsi)\./gi, '.');

  const normalizeRow = row => {
    if (!row || !row.__contoh) return row;
    for (const key of Object.keys(row)) {
      if (typeof row[key] === 'string') {
        row[key] = normalize(row[key]);
      }
    }
    return row;
  };

  // Bersihkan data awal yang dimuat ulang
  const oldDemoRows = demoRows;
  demoRows = function () {
    const result = oldDemoRows();
    for (const rows of Object.values(result)) {
      rows.forEach(row => {
        for (const key of Object.keys(row)) {
          if (typeof row[key] === 'string') {
            row[key] = normalize(row[key]);
          }
        }
      });
    }
    return result;
  };

  // Pertahankan hanya kotak peringatan di bawah referensi
  const oldNotice = demoNotice;
  demoNotice = function (...args) {
    return oldNotice(...args).replace(
      /<span class="demo-tag">[\s\S]*?<\/span>/g, ''
    );
  };

  // Nomor tabel tanpa huruf C
  const oldRenderTable = renderTable;
  renderTable = function (...args) {
    const result = oldRenderTable(...args);

    document.querySelectorAll('.example-flag').forEach(
      node => node.remove()
    );

    document.querySelectorAll('.example-row').forEach(
      node => node.classList.remove('example-row')
    );

    return result;
  };

  // Hilangkan pengulangan peringatan di dashboard
  const oldDashboard = renderDashboard;
  renderDashboard = function (...args) {
    const result = oldDashboard(...args);
    const banner = document.querySelector('.demo-landing');

    if (banner) {
      const button = banner.querySelector('button');
      if (button) {
        button.style.marginBottom = '18px';
        banner.replaceWith(button);
      } else {
        banner.remove();
      }
    }
    return result;
  };

  // Bersihkan label tambahan pada kop identitas
  const oldDisplaySettings = displaySettings;
  displaySettings = function (...args) {
    const settings = { ...oldDisplaySettings(...args) };

    for (const key of [
      'sekolah',
      'lab',
      'jabatanKepalaSekolah',
      'jabatanKepalaLab',
      'jabatanPetugasLab'
    ]) {
      if (typeof settings[key] === 'string') {
        settings[key] = normalize(settings[key]);
      }
    }

    return settings;
  };

  // Hilangkan label berulang pada ekspor DOCX
  const oldDocxXml = docxXml;
  docxXml = function (...args) {
    return oldDocxXml(...args)
      .replace(/  \|  CONTOH \/ SIMULASI/g, '')
      .replace(
        /<w:p><w:pPr><w:spacing w:after="65"\/><\/w:pPr><w:r><w:rPr><w:color w:val="617487"\/><w:sz w:val="12"\/><\/w:rPr><w:t xml:space="preserve">CATATAN:[\s\S]*?<\/w:t><\/w:r><\/w:p>/g,
        ''
      );
  };

  // Hilangkan label berulang pada ekspor PDF
  const oldPdfWriteText = pdfWriteText;
  pdfWriteText = function (page, x, y, value, ...rest) {
    const clean = String(value)
      .replace(' - CONTOH/SIMULASI', '')
      .replace(' | DATA CONTOH - BUKAN HASIL OBSERVASI', '');

    return oldPdfWriteText(page, x, y, clean, ...rest);
  };

  // Terapkan perapian pada data yang sudah tersimpan
  window.addEventListener('DOMContentLoaded', () => {
    for (const id of ['A', 'B3', 'C2', 'D2']) {
      (db.records[id] || []).forEach(normalizeRow);
    }

    if (db.settings.lab === 'Laboratorium Kimia (contoh kelas X)') {
      db.settings.lab = 'Laboratorium Kimia — Kelas X';
    }

    for (const key of [
      'sekolah',
      'jabatanKepalaSekolah',
      'jabatanKepalaLab',
      'jabatanPetugasLab'
    ]) {
      if (typeof db.settings[key] === 'string') {
        db.settings[key] = normalize(db.settings[key]);
      }
    }

    localWrite();
    render();
  });
})();
</script>
